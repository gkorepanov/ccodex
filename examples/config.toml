# ~/.ccodex/config.toml — every key is optional.

# Remove or comment out rename_prompt to restore stock Codex title generation.
rename_prompt = """
Create a concise, vivid, memorable title for the task.
Start with exactly one rare, expressive, context-relevant emoji followed by one space.
Avoid generic decorative emoji when a more specific symbol fits.
Keep the complete title, including emoji, within 36 characters.
Return only the title.
"""
# title_model = "gpt-6-luna"        # default: the first visible luna/mini Codex model

# codex_binary = "/path/to/codex"   # default: the first `codex` on PATH that is not CCodex
# delegate_codex = "/path/to/codex" # what plain `codex …` (TUI, exec, login) runs; default: codex_binary
# claude_binary = "/path/to/claude" # default: the Claude Code bundled with the Agent SDK
# data_dir = "~/.ccodex/state"
# model_prefix = "claude:"

log_level = "info"
# Codex App RPC capture under data_dir (rpc.jsonl, mode 0600, rolling).
rpc_capture = true
rpc_capture_max_bytes = 1073741824
